name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag, versions, and default-branch ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun run version:check
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun audit
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run benchmark:10k
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Confirm tracked source stayed clean
        run: git diff --exit-code
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  native-binary:
    name: Native binary (${{ matrix.label }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
            filename: recruit-ai-linux-x64
          - label: Windows x64
            os: windows-latest
            artifact: windows-x64
            filename: recruit-ai-windows-x64.exe
          - label: macOS arm64
            os: macos-latest
            artifact: macos-arm64
            filename: recruit-ai-macos-arm64
          - label: macOS x64
            os: macos-15-intel
            artifact: macos-x64
            filename: recruit-ai-macos-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify synchronized versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run version:check
      - run: bun run build:binary
      - run: bun run smoke:binary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.artifact }}
          path: dist-bin/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 1

  package-and-draft:
    name: Package unsigned draft release
    needs: [validate, native-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify synchronized release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run version:check
      - run: bun run build:binaries
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: dist-bin/native-binaries
          merge-multiple: true
      - name: Use the natively smoke-tested executables
        run: |
          cp dist-bin/native-binaries/recruit-ai-linux-x64 dist-bin/recruit-ai-linux-x64
          cp dist-bin/native-binaries/recruit-ai-windows-x64.exe dist-bin/recruit-ai-windows-x64.exe
          cp dist-bin/native-binaries/recruit-ai-macos-arm64 dist-bin/recruit-ai-macos-arm64
          cp dist-bin/native-binaries/recruit-ai-macos-x64 dist-bin/recruit-ai-macos-x64
          chmod 755 dist-bin/recruit-ai-linux-x64
          chmod 755 dist-bin/recruit-ai-macos-arm64
          chmod 755 dist-bin/recruit-ai-macos-x64
      - run: bun run smoke:binary -- dist-bin/recruit-ai-linux-x64
      - run: bun run release:package
      - name: Verify release manifest policy
        run: |
          jq --exit-status \
            '.sourceDirty == false and .unsigned == true and .mode == "release"' \
            dist-bin/manifest.json
      - name: Verify packaged checksums
        working-directory: dist-bin
        run: sha256sum --check SHA256SUMS
      - name: Create or update the unsigned draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            "dist-bin/recruit-ai-${RELEASE_TAG}-linux-x64.tar.gz"
            "dist-bin/recruit-ai-${RELEASE_TAG}-macos-arm64.tar.gz"
            "dist-bin/recruit-ai-${RELEASE_TAG}-macos-x64.tar.gz"
            "dist-bin/recruit-ai-${RELEASE_TAG}-windows-x64.zip"
            "dist-bin/manifest.json"
            "dist-bin/SHA256SUMS"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to overwrite published release $RELEASE_TAG." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --title "RecruitAI $RELEASE_TAG (unsigned draft)" \
              --notes "Unsigned draft artifacts. Verify SHA256SUMS and complete platform signing/notarization review before publishing." \
              --verify-tag
          fi
